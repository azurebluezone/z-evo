# Nginx vhost for z-evo (Jannat Mini Mart)
#
# Install:
#   sudo cp deploy/nginx-z-evo.conf /etc/nginx/sites-available/z-evo
#   sudo ln -s /etc/nginx/sites-available/z-evo /etc/nginx/sites-enabled/z-evo
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires: php8.2-fpm (the patched 8.2.35 build; see
# docs/SECURITY-php2shell-2026-10-24.md).
#
# WHY THE /uploads/ BLOCK EXISTS
# -----------------------------------------------------------------------------
# A generic `location ~ \.php$` runs ANY .php file under the document root,
# including one an admin upload lands in public/uploads/. Combined with an
# upload validation slip, that is a direct RCE path that has nothing to do
# with PHP2Shell. The `^~ /uploads/` block below wins over the regex location
# (prefix match with ^~ beats regex), so uploaded files are only ever served
# as static bytes - and a .php request there returns 404 instead of executing.

server {
    listen 80;
    listen [::]:80;
    server_name jannat.example.com;   # TODO: replace with the real host

    root /home/xubuntu/Desktop/z-evo/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 20m;

    # ---- security headers -------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Enable only after the site is fully HTTPS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- uploaded files: static only, never executed ----------------------
    location ^~ /uploads/ {
        try_files $uri =404;
        # Belt and braces: even if a .php file reaches this folder, do not run it.
        location ~ \.php$ {
            return 404;
        }
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- framework internals ----------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* ^/bootstrap/cache/ {
        deny all;
    }

    # ---- front controller --------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 300;
        fastcgi_hide_header X-Powered-By;
    }

    # ---- static asset caching ---------------------------------------------
    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|svg|woff2?|ttf|eot|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/z-evo.access.log;
    error_log  /var/log/nginx/z-evo.error.log;
}
